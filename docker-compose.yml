services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: take
      POSTGRES_PASSWORD: take
      POSTGRES_DB: take
    ports:
      - "5432:5432"
    volumes:
      - take_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U take -d take"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  take_postgres_data:
