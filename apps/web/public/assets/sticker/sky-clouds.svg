<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" preserveAspectRatio="xMidYMin slice">
  <!-- Original TAKE sky: soft cumulus shapes built from circles. No photography. -->
  <defs>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="haze" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <g id="cloud">
      <circle cx="60" cy="70" r="42" />
      <circle cx="120" cy="48" r="56" />
      <circle cx="190" cy="62" r="46" />
      <circle cx="240" cy="82" r="32" />
      <rect x="30" y="72" width="236" height="44" rx="22" />
    </g>
  </defs>
  <g fill="#ffffff">
    <use href="#cloud" transform="translate(-40 40) scale(1.25)" opacity=".55" filter="url(#haze)" />
    <use href="#cloud" transform="translate(-30 60) scale(1.05)" opacity=".92" filter="url(#soft)" />
    <use href="#cloud" transform="translate(860 120) scale(1.4)" opacity=".5" filter="url(#haze)" />
    <use href="#cloud" transform="translate(880 140) scale(1.15)" opacity=".9" filter="url(#soft)" />
    <use href="#cloud" transform="translate(420 420) scale(.7)" opacity=".7" filter="url(#soft)" />
    <use href="#cloud" transform="translate(-60 640) scale(1.5)" opacity=".5" filter="url(#haze)" />
    <use href="#cloud" transform="translate(-40 660) scale(1.2)" opacity=".88" filter="url(#soft)" />
    <use href="#cloud" transform="translate(780 820) scale(1.35)" opacity=".86" filter="url(#soft)" />
    <use href="#cloud" transform="translate(360 1120) scale(.9)" opacity=".8" filter="url(#soft)" />
    <use href="#cloud" transform="translate(980 1180) scale(1.1)" opacity=".7" filter="url(#haze)" />
  </g>
</svg>
